
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora XP MEE6</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px;
  background: #171923;
  color: #fff;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 480px;
  margin: 30px auto;
  padding: 28px;
  background: #242938;
  border-radius: 18px;
  box-shadow: 0 8px 30px #0005;
}
h1 { text-align: center; color: #8b9cff; }
.subtitle { text-align: center; color: #aab2c5; }
label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  color: #cbd2e1;
}
input {
  width: 100%;
  padding: 13px;
  border: 1px solid #454e65;
  border-radius: 9px;
  background: #171d2b;
  color: white;
  font-size: 17px;
}
.controls {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
button {
  flex: 1;
  padding: 12px;
  border: 0;
  border-radius: 9px;
  background: #6679f5;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: #8290ff; }
.result {
  margin-top: 25px;
  padding: 20px;
  background: #171d2b;
  border-radius: 12px;
  line-height: 1.9;
}
.result h2 {
  color: #8b9cff;
  font-size: 19px;
}
.number {
  color: #75e5ad;
  font-size: 23px;
  font-weight: bold;
}
.error { color: #ff7777; }
</style>
</head>
<body>

<div class="container">
  <h1>⚡ Calculadora MEE6</h1>
  <p class="subtitle">Calculadora exacta de experiencia</p>

  <label>Nivel actual</label>
  <input id="actual" type="number" min="0" value="10">

  <label>XP actual dentro del nivel</label>
  <input id="xp" type="number" min="0" value="0">

  <label>Nivel deseado</label>
  <input id="deseado" type="number" min="0" value="20">

  <div class="controls">
    <button onclick="ajustar(-1)">− Quitar nivel</button>
    <button onclick="ajustar(1)">+ Agregar nivel</button>
  </div>

  <button style="width:100%; margin-top:15px"
          onclick="calcular()">CALCULAR XP</button>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    Introduce tus datos y pulsa calcular.
  </div>
</div>

<script>
// XP acumulada necesaria para alcanzar un nivel.
function xpNivel(n) {
  return (5 / 6) * n * (2*n*n + 27*n + 91);
}

// XP necesaria para pasar del nivel actual al siguiente.
function xpSiguiente(n) {
  return 5*n*n + 50*n + 100;
}

function ajustar(cantidad) {
  const campo = document.getElementById("deseado");
  campo.value = Math.max(0, Number(campo.value) + cantidad);
}

function formato(n) {
  return Math.round(n).toLocaleString("es-ES");
}

function calcular() {
  const nivel = Number(document.getElementById("actual").value);
  const xp = Number(document.getElementById("xp").value);
  const objetivo = Number(document.getElementById("deseado").value);
  const resultado = document.getElementById("resultado");

  if (![nivel, xp, objetivo].every(Number.isSafeInteger) ||
      nivel < 0 || objetivo < 0 || xp < 0) {
    resultado.innerHTML =
      '<p class="error">Introduce números enteros válidos.</p>';
    return;
  }

  const limite = xpSiguiente(nivel);

  if (xp >= limite) {
    resultado.innerHTML =
      '<p class="error">El XP actual debe ser menor que ' +
      formato(limite) + ' para el nivel ' + nivel + '.</p>';
    return;
  }

  const totalActual = xpNivel(nivel) + xp;
  const totalObjetivo = xpNivel(objetivo);
  const diferencia = totalObjetivo - totalActual;
  const progreso = xp / limite * 100;

  resultado.innerHTML = `
    <h2>📊 Resultado</h2>
    <p>XP total actual:<br>
    <span class="number">${formato(totalActual)}</span></p>

    <p>XP necesario para el objetivo:<br>
    <span class="number">${formato(totalObjetivo)}</span></p>

    <p>${diferencia >= 0 ? "XP que necesitas ganar:" : "XP que necesitas quitar:"}<br>
    <span class="number">${formato(Math.abs(diferencia))} XP</span></p>

    <p>Progreso dentro del nivel actual:<br>
    ${progreso.toFixed(2)}%</p>

    <p>XP restante para subir un nivel:<br>
    ${formato(limite - xp)} XP</p>

    <p>Objetivo: Nivel ${objetivo}</p>
  `;
}
</script>
</body>
</html>
